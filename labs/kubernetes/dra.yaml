# Replace example-gpu-class with the installed driver's real DeviceClass.
# Driver/device-specific runtime image and command must also be validated.
apiVersion: resource.k8s.io/v1
kind: ResourceClaim
metadata: {name: gpu-lab, namespace: inference-lab}
spec:
  devices:
    requests:
      - name: gpu
        exactly:
          deviceClassName: example-gpu-class
          allocationMode: ExactCount
          count: 1
---
apiVersion: v1
kind: Pod
metadata: {name: dra-consumer, namespace: inference-lab}
spec:
  restartPolicy: Never
  resourceClaims:
    - name: gpu
      resourceClaimName: gpu-lab
  containers:
    - name: inspect
      image: vllm/vllm-openai:v0.29.0
      command: [sh, -c, 'nvidia-smi && sleep 60']
      resources:
        claims: [{name: gpu}]
