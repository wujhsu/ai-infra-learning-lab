apiVersion: v1
kind: Namespace
metadata:
  name: inference-lab
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm
  namespace: inference-lab
spec:
  replicas: 1
  selector:
    matchLabels: {app: vllm}
  template:
    metadata:
      labels: {app: vllm}
    spec:
      containers:
        - name: engine
          image: vllm/vllm-openai:v0.29.0
          args:
            - Qwen/Qwen2.5-0.5B-Instruct
            - --served-model-name
            - lab-model
            - --max-model-len
            - '4096'
            - --gpu-memory-utilization
            - '0.8'
          ports: [{containerPort: 8000}]
          resources:
            requests: {cpu: '2', memory: 8Gi}
            limits: {nvidia.com/gpu: 1, memory: 16Gi}
          startupProbe:
            httpGet: {path: /health, port: 8000}
            periodSeconds: 10
            failureThreshold: 120
          readinessProbe:
            httpGet: {path: /health, port: 8000}
            periodSeconds: 10
          volumeMounts: [{name: shm, mountPath: /dev/shm}]
      volumes:
        - name: shm
          emptyDir: {medium: Memory, sizeLimit: 2Gi}
---
apiVersion: v1
kind: Service
metadata: {name: vllm, namespace: inference-lab}
spec:
  selector: {app: vllm}
  ports: [{port: 8000, targetPort: 8000}]
